[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flavri-mcp"
version = "0.1.0"
description = "FastMCP server for the FLAVRI 2.0 148-dimensional multimodal chemosensory foundation model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=0.1.0",
    "torch>=2.4.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pydantic>=2.0",
    "tqdm>=4.65.0",
]

[project.scripts]
flavri-mcp = "flavri_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
